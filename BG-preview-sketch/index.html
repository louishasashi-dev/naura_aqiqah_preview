<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Preview Background Naura Aqiqah</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #2f2a24;
            background: #f7f4ee;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 32px;
            background:
                radial-gradient(circle at 20% 15%, rgba(212, 184, 126, 0.16), transparent 38%),
                #f7f4ee;
        }

        main {
            width: min(720px, 100%);
        }

        h1 {
            margin: 0 0 8px;
            font-size: clamp(1.8rem, 4vw, 2.6rem);
            font-weight: 600;
            letter-spacing: -0.03em;
        }

        .intro {
            margin: 0 0 28px;
            color: #6f675e;
            line-height: 1.6;
        }

        .choices {
            display: grid;
            gap: 14px;
        }

        a {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 18px 20px;
            border: 1px solid #dcd2c2;
            border-radius: 12px;
            background: #fffdf9;
            color: inherit;
            text-decoration: none;
            transition: border-color 0.2s ease, transform 0.2s ease;
        }

        a:hover {
            border-color: #b79a5c;
            transform: translateY(-2px);
        }

        a:focus-visible {
            outline: 3px solid #b79a5c;
            outline-offset: 3px;
        }

        strong {
            font-size: 1.1rem;
        }

        span {
            color: #7b7167;
            font-size: 0.92rem;
        }

        @media (max-width: 560px) {
            a {
                align-items: flex-start;
                flex-direction: column;
                gap: 6px;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>Preview Background Naura Aqiqah</h1>
        <p class="intro">Pilih salah satu konsep untuk dibuka terpisah.</p>
        <div class="choices">
            <a href="luxury-islamic.html">
                <strong>Luxury Islamic</strong>
                <span>Emerald, deep olive, champagne gold, ivory</span>
            </a>
            <a href="warm-arabian.html">
                <strong>Warm Arabian</strong>
                <span>Ivory, warm beige, champagne gold, soft brown</span>
            </a>
        </div>
    </main>
</body>
</html>
